name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build and check wheel
        run: |
          python -m build --wheel
          python -m twine check --strict dist/*.whl

      - name: Verify wheel version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import sys
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"Expected exactly one wheel, found {len(wheels)}")

          with ZipFile(wheels[0]) as wheel:
              metadata_path, = (
                  name for name in wheel.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              version = BytesParser().parsebytes(wheel.read(metadata_path))["Version"]

          tag = os.environ["RELEASE_TAG"]
          if not version or version != tag.removeprefix("v"):
              sys.exit(f"Wheel version {version!r} does not match release tag {tag!r}")
          print(f"Wheel version {version!r} matches release tag {tag!r}")
          PY

      - name: Save wheel for testing and publishing
        uses: actions/upload-artifact@v7
        with:
          name: release-wheel
          path: dist/*.whl
          if-no-files-found: error

  test:
    name: Test wheel on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, ubuntu-24.04-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v8
        with:
          name: release-wheel
          path: dist

      - name: Install wheel and its test dependencies
        run: |
          python -m pip install --upgrade pip
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[test]"
          python -m pip check

      - name: Test installed wheel
        # Clear the source-tree pythonpath setting and avoid prepending test paths.
        run: python -m pytest --import-mode=importlib -o pythonpath= tests

  publish-testpypi:
    name: Publish wheel to TestPyPI
    needs: [build, test]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/antsnormflows
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-wheel
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  attach-wheel:
    name: Attach wheel to GitHub release
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-wheel
          path: dist

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl --clobber
